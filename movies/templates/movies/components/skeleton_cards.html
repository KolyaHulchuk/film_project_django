{# Grey poster-card skeletons. Params: count (default 8), variant: cc (catalog grid) | tr | pp | md (home rows). Use inside the same wrapper (.cgrid / .track) the real cards use. #}
{% load catalog_tags %}
{% for i in count|default:8|times %}
  <div class="sk-card {% if variant == 'cc' %}cc{% elif variant == 'tr' %}pc tr-card{% elif variant == 'md' %}pc md-card{% else %}pc pp-card{% endif %}" aria-hidden="true" {% if variant == 'cc' %}style="opacity:1;animation:none"{% endif %}>
    <div class="sk pulse sk-poster" style="aspect-ratio:2/3"></div>
    <div class="sk pulse sk-line" style="width:78%"></div>
    <div class="sk pulse sk-line" style="width:42%;height:9px"></div>
  </div>
{% endfor %}
