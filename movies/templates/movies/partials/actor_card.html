{# Round person card (design: .st-card). Param: actor (TMDB person dict). #}
<div class="st-card" role="listitem">
  <span class="st-photo"><span class="st-img">
    <span class="st-ini" aria-hidden="true">{{ actor.name|slice:":1" }}</span>
    {% if actor.profile_path %}<img src="https://image.tmdb.org/t/p/w185{{ actor.profile_path }}" alt="{{ actor.name }}" width="128" height="128" loading="lazy" decoding="async" onerror="this.classList.add('broken')">{% endif %}
  </span></span>
  <span class="st-name">{{ actor.name }}</span>
  {% if actor.known_for %}{% with k=actor.known_for.0 %}<span class="st-known">{% firstof k.title k.name %}</span>{% endwith %}{% endif %}
</div>
