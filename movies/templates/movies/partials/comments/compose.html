<div id="cm-compose" class="cm-compose"{% if oob %} hx-swap-oob="true"{% endif %}>
    {% if not user.is_authenticated %}
    <div class="cm-locked">
        <div>
            <span class="ring"><svg class="ic"><use href="#i-lock"/></svg></span>
            <span><b><a href="{% url 'login' %}?next={{ movie_url|urlencode }}%23comments" class="cm-link">Log in</a> to leave a comment</b><span>Join the discussion about {{ movie.title }}.</span></span>
        </div>
        <a href="{% url 'login' %}?next={{ movie_url|urlencode }}%23comments" class="btn btn-red sm" tabindex="-1" aria-hidden="true">Log in</a>
    </div>
    {% else %}
    <form class="composer cm-form"
          hx-post="{% url 'comment-create' movie.id %}"
          hx-target="#cm-compose"
          hx-swap="outerHTML"
          x-data="{ len: 0, blank: true, sync(el) { this.len = el.value.length; this.blank = !el.value.trim(); } }"
          x-init="sync($refs.text)">
        <span class="cm-av" style="--hue: {% widthratio user.id 1 37 %}" aria-hidden="true">{{ user.username|first|upper }}</span>
        <div class="cp-body">
            <label for="cm-text" class="sr">Your comment</label>
            <textarea id="cm-text"
                      name="text"
                      class="ta{% if form.text.errors %} is-invalid{% endif %}"
                      rows="3"
                      maxlength="{{ comment_max_length }}"
                      placeholder="What did you think of this {% if movie.media_type == 'tv' %}series{% else %}movie{% endif %}? No spoilers, please"
                      {% if form.text.errors %}aria-invalid="true" aria-describedby="cm-text-error"{% endif %}
                      x-ref="text"
                      @input="sync($el)"
                      @keydown.ctrl.enter.prevent="$el.form.requestSubmit()"
                      @keydown.meta.enter.prevent="$el.form.requestSubmit()">{{ form.text.value|default:"" }}</textarea>
            {% if form.text.errors %}
            <p id="cm-text-error" class="cm-error">{{ form.text.errors.0 }}</p>
            {% endif %}
            <div class="cp-act">
                <small class="cm-counter" :class="{ 'is-near': len > {{ comment_max_length }} - 100 }"><span x-text="len">0</span>/{{ comment_max_length }}</small>
                <button type="submit" class="btn btn-red sm" :disabled="blank">
                    <span class="cm-idle">Post</span>
                    <span class="cm-busy">Posting…</span>
                </button>
            </div>
        </div>
    </form>
    {% endif %}
</div>
