{% if not user.is_authenticated %}{% firstof "Log in to vote" as locked %}{% elif comment.user_id == user.id %}{% firstof "You can't vote on your own comment" as locked %}{% endif %}
<div id="cm-votes-{{ comment.id }}" class="cm-votes{% if locked %} is-locked{% endif %}"{% if locked %} title="{{ locked }}"{% endif %}>
    <button type="button"
            class="cm-vote cm-vote-up{% if comment.user_vote == 1 %} is-active{% endif %}"
            aria-label="Like ({{ comment.likes }})"
            aria-pressed="{% if comment.user_vote == 1 %}true{% else %}false{% endif %}"
            {% if locked %}disabled{% else %}hx-post="{% url 'comment-vote' comment.id %}" hx-vals='{"value": 1}' hx-target="#cm-votes-{{ comment.id }}" hx-swap="outerHTML" hx-sync="closest .cm-votes:drop" hx-indicator="#cm-votes-{{ comment.id }}"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4v-9h3Zm2 9V10.5l4.2-7a1.8 1.8 0 0 1 3.3 1.3L15.6 9H20a2 2 0 0 1 2 2.3l-1.3 7A2 2 0 0 1 18.7 20H9Z"/></svg>
        <span class="cm-vote-n">{{ comment.likes }}</span>
    </button>
    <button type="button"
            class="cm-vote cm-vote-down{% if comment.user_vote == -1 %} is-active{% endif %}"
            aria-label="Dislike ({{ comment.dislikes }})"
            aria-pressed="{% if comment.user_vote == -1 %}true{% else %}false{% endif %}"
            {% if locked %}disabled{% else %}hx-post="{% url 'comment-vote' comment.id %}" hx-vals='{"value": -1}' hx-target="#cm-votes-{{ comment.id }}" hx-swap="outerHTML" hx-sync="closest .cm-votes:drop" hx-indicator="#cm-votes-{{ comment.id }}"{% endif %}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 13V4h3v9h-3Zm-2-9v9.5l-4.2 7a1.8 1.8 0 0 1-3.3-1.3L8.4 15H4a2 2 0 0 1-2-2.3l1.3-7A2 2 0 0 1 5.3 4H15Z"/></svg>
        <span class="cm-vote-n">{{ comment.dislikes }}</span>
    </button>
</div>
