version: '3.9'

services:
    
    web:
        build: .
        image: project
        ports:
          - "8001:8001"
        volumes:
          - .:/app
        environment:
          - DATABASE_URL=${DATABASE_URL}
          - REDIS_URL=redis://redis:6379/0
        env_file:
          - .env
        command: python manage.py runserver 0.0.0.0:8001
        depends_on:
          - db
          - redis

    worker:
        build: .
        image: project
        volumes:
          - .:/app
        environment:
          - DATABASE_URL=${DATABASE_URL}
          - REDIS_URL=redis://redis:6379/0
        env_file:
          - .env
        command: celery -A config worker --loglevel=info
        depends_on:
          - db
          - redis

    db:
        image: postgres:16
        env_file:
          - .env
        volumes:
          - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine

volumes:
  pgdata:

