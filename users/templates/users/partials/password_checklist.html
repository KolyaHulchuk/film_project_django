{# Strength bar + requirement list, driven by auth.js from the password input that has data-checklist="<id>". Informational only: Django validates on the server. #}
<div id="{{ id }}" data-req aria-live="polite">
  <div class="str" aria-hidden="true"><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span></div>
  <div class="str-l"><span>Password strength</span><b data-str-label>Too short</b></div>
  <ul class="req" aria-label="Password requirements">
    <li data-rule="len"><span class="ck-i"><svg class="ic"><use href="#i-check"/></svg></span>At least 8 characters</li>
    <li data-rule="nonnum"><span class="ck-i"><svg class="ic"><use href="#i-check"/></svg></span>Not only numbers</li>
    <li data-rule="mix"><span class="ck-i"><svg class="ic"><use href="#i-check"/></svg></span>Letters and numbers or symbols</li>
  </ul>
</div>
