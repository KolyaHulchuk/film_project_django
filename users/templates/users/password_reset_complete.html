{% extends "users/auth_card_base.html" %}
{% block auth_card %}
<div class="state" role="status">
  <span class="big white"><svg class="ic"><use href="#i-check"/></svg></span>
  <h1>Your password has been changed</h1>
  <p class="sub">You can now sign in with your new password.</p>
  <div class="acts"><a href="{% url 'login' %}" class="btn btn-red full">Log in</a></div>
</div>
{% endblock %}
