{% extends "users/auth_card_base.html" %}
{% block auth_card %}
<div class="state" role="status">
  <span class="big red"><svg class="ic"><use href="#i-mail"/></svg></span>
  <h1>Check your email</h1>
  <p class="sub">If an account exists for that email, we’ve sent a link to reset your password. It can take a few minutes — check your spam folder if it doesn’t show up.</p>
  <div class="acts"><a href="{% url 'login' %}" class="btn btn-ghost full">Back to login</a></div>
  <p class="resend">Wrong email? <a href="{% url 'password_reset' %}" class="lnk-a strong">Try again</a></p>
</div>
{% endblock %}
